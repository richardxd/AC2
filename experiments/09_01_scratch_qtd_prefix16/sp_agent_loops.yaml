# Agent-loop registry, pinned by the runner via
#   actor_rollout_ref.rollout.agent.agent_loop_config_path=<this file>
# sp_prefix_agent: continues a replay prefix, honoring the per-row sp_q_max_new_tokens cap
#   (ready, non-audited rows get an action chunk of min(b, C - a_i) new tokens, where C is the
#   response budget and a_i the prefix length).
# sp_q_agent: the critic-query loop -- raw context ids in, at most 4 greedy tokens out, free
#   decoding (no constraint to the value grid).
# Validation rows fall back to default_agent_loop (single_turn_agent).
- name: sp_prefix_agent
  _target_: verl.experimental.agent_loop.prefix_agent_loop.PrefixAgentLoop
- name: sp_q_agent
  _target_: verl.experimental.agent_loop.sp_q_agent_loop.SPQAgentLoop
